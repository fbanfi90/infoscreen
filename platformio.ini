[env:infoscreen]
; pioarduino = community fork of the Espressif platform with Arduino core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; flash is quad-SPI, the 8 MB PSRAM is octal-SPI
board_build.arduino.memory_type = qio_opi

lib_deps =
  moononournation/GFX Library for Arduino@^1.5.0
  bblanchon/ArduinoJson@^7.0.0

; Personal settings (WiFi, station, weather location) come from .env,
; see .env.example. load_env.py turns them into -D defines.
extra_scripts = pre:load_env.py

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
